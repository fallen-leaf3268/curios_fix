plugins {
    id 'eclipse'
    id 'idea'
    id 'maven-publish'
    id 'net.minecraftforge.gradle' version '[6.0,6.2)'
    id 'org.spongepowered.mixin' version '0.7.+'
}

version = '1.0.0'
group = 'com.example.curiosfix'

base {
    archivesName = 'curios_fix'
}

java.toolchain.languageVersion = JavaLanguageVersion.of(17)

minecraft {
    mappings channel: 'official', version: '1.20.1'

    runs {
        client {
            workingDirectory project.file('run')
            property 'forge.logging.markers', 'SCAN,REGISTRIES,REGISTRYDUMP'
            property 'forge.logging.console.level', 'debug'

            mods {
                curiosfix {
                    source sourceSets.main
                }
            }
        }

        server {
            workingDirectory project.file('run')
            property 'forge.logging.markers', 'SCAN,REGISTRIES,REGISTRYDUMP'
            property 'forge.logging.console.level', 'debug'

            mods {
                curiosfix {
                    source sourceSets.main
                }
            }
        }
    }
}

dependencies {
    minecraft "net.minecraftforge:forge:1.20.1-47.4.0"

    compileOnly fg.deobf(files("C:/Users/Lenovo/.gradle/caches/forge_gradle/deobf_dependencies/top/theillusivec4/curios/curios-forge/5.14.1+1.20.1_mapped_official_1.20.1/curios-forge-5.14.1+1.20.1_mapped_official_1.20.1.jar"))
    annotationProcessor 'org.spongepowered:mixin:0.8.4:processor'
    testImplementation 'org.junit.jupiter:junit-jupiter:5.10.2'
    testImplementation files("C:/Users/Lenovo/.gradle/caches/forge_gradle/deobf_dependencies/top/theillusivec4/curios/curios-forge/5.14.1+1.20.1_mapped_official_1.20.1/curios-forge-5.14.1+1.20.1_mapped_official_1.20.1.jar")
}

mixin {
    add sourceSets.main, "curios_fix.mixins.json"
    config "curios_fix.mixins.json"
}

repositories {
    maven {
        name = "CuriosMaven"
        url = "https://maven.blamejared.com/"
    }
}

jar {
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
    manifest {
        attributes(["Specification-Title"     : "curios_fix",
                    "Specification-Vendor"    : "curios_fix",
                    "Specification-Version"   : "1",
                    "Implementation-Title"    : "curios_fix",
                    "Implementation-Version"  : "${version}",
                    "Implementation-Vendor"   : "curios_fix",
                    "Implementation-Timestamp": new Date().format("yyyy-MM-dd'T'HH:mm:ssZ"),
                    "MixinConfigs"            : "curios_fix.mixins.json"],)
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

tasks.named('test', Test) {
    useJUnitPlatform()
}

jar.finalizedBy('reobfJar')
